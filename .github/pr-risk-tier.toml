size_limit = 400
default_tier = 1
test_paths = ["test/**"]

[[rule]]
id = "docs"
tier = 0
paths = ["**/*.md"]

[[rule]]
id = "dados_e_contratos"
tier = 2
paths = ["config/models.persistentmodels", "config/routes.yesodroutes", "src/Integracao/**"]

[[rule]]
id = "seguranca_e_infra"
tier = 3
paths = ["src/Foundation.hs", "config/settings.yml", "package.yaml", "stack.yaml", "stack.yaml.lock", ".github/**", "docker-compose.yml", "docker/**"]
