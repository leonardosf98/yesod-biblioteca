name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (HLint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2.4.10
        with:
          version: "3.10"

      - uses: haskell-actions/hlint-run@eaca4cfbf4a69f4eb875df38b6bc3e1657020378 # v2.4.10
        with:
          path: '["src/", "app/", "test/"]'
          fail-on: warning

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan
        run: semgrep scan --error --config auto --config p/secrets

  build-test:
    name: Build e testes
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
          POSTGRES_DB: biblioteca_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar libpq-dev
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: latest

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: stack-${{ runner.os }}-

      - name: Build
        run: stack build --test --no-run-tests

      - name: Testes
        run: stack test

      - name: Listar dependências para a auditoria
        run: |
          stack ls dependencies --separator ' ==' \
            | grep -v '^biblioteca ' \
            | sed 's/^/any./' \
            | paste -sd, \
            | sed 's/,/,\n             /g; s/^/constraints: /' \
            > cabal.project.freeze
          head -5 cabal.project.freeze
          wc -l cabal.project.freeze

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependencias
          path: cabal.project.freeze

  dependency-audit:
    name: Auditoria de dependências (OSV)
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependencias

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        continue-on-error: true
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=cabal.project.freeze
            --format=json
            --output-file=osv-resultado.json

      - name: Falhar em aviso não revisado
        run: |
          if [ ! -s osv-resultado.json ]; then
            echo "::error::osv-scanner não gerou resultado; confira o passo anterior."
            exit 1
          fi
          jq -r '.results[]?.packages[]? | .package.name + "-" + .package.version as $p | .groups[]? | "\($p) \(.ids | join(",")) cvss=\(.max_severity // "")"' osv-resultado.json | tee achados.txt
          TOTAL=$(wc -l < achados.txt)
          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::${TOTAL} aviso(s) de segurança sem revisão. Atualize a dependência ou registre o motivo em osv-scanner.toml."
            exit 1
          fi
          echo "Nenhum aviso pendente (os revisados estão em osv-scanner.toml)."

  evidence:
    name: Pacote de evidências
    needs: [lint, sast, build-test, dependency-audit]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: leonardosf98/pr-risk-tier@ccfd06a479f4f3f1a9bbd56ae6ba38a2255d0e9b # v1.2.0
