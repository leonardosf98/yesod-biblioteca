name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
          POSTGRES_DB: biblioteca_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar libpq-dev
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: stack-${{ runner.os }}-

      - name: Build
        run: stack build --test --no-run-tests

      - name: Testes
        run: stack test

  evidence:
    name: Pacote de evidências
    needs: [build-test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leonardosf98/pr-risk-tier@v1
